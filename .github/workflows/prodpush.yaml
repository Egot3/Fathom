name: Test & Build & Push to GHCR

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify-branch:
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        id: check
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: verify-branch
    if: needs.verify-branch.outputs.on_main == 'true'
    uses: ./.github/workflows/go-test.yaml

  build:
    needs: [verify-branch, test]
    if: needs.verify-branch.outputs.on_main == 'true'
    uses: ./.github/workflows/reusable.yaml
    with:
      path: "applications/application"
      version_name: "め"
      version_type: "dev"
      semver: "${{ github.ref_name }}"

    secrets: inherit

  tickle:
    needs: [build]
    uses: ./.github/workflows/tickle-webhook.yaml
    with:
      domain: "${{ vars.KOMODO_DOMAIN }}"
      body: '{"type":"DeployStack","params":{"stack":"fathom_compose"}}'
    secrets:
      API_KEY: "${{ secrets.FATHOM_KOMODO_API_KEY }}"
      API_SECRET: "${{ secrets.FATHOM_KOMODO_API_SECRET }}"
