name: Tickle webhook

on:
  workflow_call:
    secrets:
      API_KEY:
        required: true
      API_SECRET:
        required: true
    inputs:
      domain:
        type: string
        required: true
      key_header:
        type: string
        required: false
        default: "X-Api-Key"
      secret_header:
        type: string
        required: false
        default: "X-Api-Secret"
      body:
        type: string
        required: false

jobs:
  tickle:
    runs-on: ubuntu-latest
    steps:
      - name: Tickle
        env:
          DOMAIN: ${{ inputs.domain }}
          KEY_HEADER: ${{ inputs.key_header }}
          SECRET_HEADER: ${{ inputs.secret_header }}
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          BODY: ${{ inputs.body }}
        run: |
          args=()
          if [ -n "$BODY" ]; then args+=(--data "$BODY"); fi
          curl -fsS -X POST "https://${DOMAIN}/execute" \
            -H "Content-Type: application/json" \
            -H "${KEY_HEADER}: ${API_KEY}" \
            -H "${SECRET_HEADER}: ${API_SECRET}" \
            "${args[@]}"
