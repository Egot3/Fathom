name: Reusable workflow push

on:
  workflow_call:
    inputs:
      path:
        required: false # so if I would use "" it would go to ghcr.io/<user>/<repo>
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: loginto GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase repo
        id: repo
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.REPO }}
          tags: |
            type=semver,pattern={{version}}

      - name: cache ref
        id: cache
        run: |
          if [[ "${{ inputs.path }}" != "" ]]; then
              echo "REF=ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.path }}/cache" >> $GITHUB_OUTPUT
          else
              echo "REF=ghcr.io/${{ steps.repo.outputs.REPO }}/cache" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3
      - name: build&push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.path }}
          file: ./${{ inputs.path }}/dockerfile
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=registry,ref=${{ steps.cache.outputs.REF }}:buildcache-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.REF }}:buildcache-${{ github.ref_name }},mode=max
